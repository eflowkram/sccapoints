[region]
# Which region's scoring rules to use. This selects the module of the same
# name (sdr.py, calclub.py) and names the database file, which is per season:
# <club>_<year>_points.db. Points are annual, so seasons never share a database.
# Add a region by dropping a <region>.py next to clubpoints.py that provides
# points_card(), calc_points() and calc_drops().
#
#   sdr     - San Diego Region
#   calclub - Cal Club
#
# SDR and Cal Club differ in both how points are scored and how many events
# a driver may drop, which is why each gets its own module.
club = sdr

# Classes that are run but do not earn points, comma separated. Matched exactly
# against the class name printed in the results.
#   X  - eXtra runs. Someone taking extra laps, not competing.
#        These also carry an X-suffixed car number ("681X"), which the parser
#        skips independently of this setting.
#   TO - Time Only. Out enjoying their car at an autocross, not racing anyone.
#   N  - SDR novice.
#   calclub: X,TO
#   sdr:     X,TO,N
# NOV (novice) is a real scoring class at Cal Club -- do not list it here.
# Novices are given 600-series car numbers, which points_card() already excludes
# until they take a permanent number.
non_points = X,TO

# NOTE: the old `CT` option is gone. The best-time column is now detected per
# row (second to last), because Axware's column count varies with the number
# of runs at an event. Leaving CT set here is harmless; it is ignored.
